    .downloads a {

    }

    footer strong {

    /* --- SLIDE-IN ANIMATION --- */
    @keyframes fadeUp {

      }

        transform: translateY(0);
      }

    main {
      animation: fadeUp 0.8s ease forwards;

    h1 {
  display: flex;

/* ===== 💫 Premium Finishing Touch Additions ===== */

/* 🌌 Static premium glow background — frozen shimmer */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0,255,136,0.08), rgba(0,255,136,0) 70%);
  z-index: 0;
  opacity: 0.08;
}

/* 🪶 Smooth intro fade for main content */
body > * {
  position: relative;
  z-index: 1;
  opacity: 0;
  transform: translateY(15px);
  animation: riseIn 1.2s ease-out forwards;
}
body > *:nth-child(2) { animation-delay: 0.2s; }
body > *:nth-child(3) { animation-delay: 0.4s; }
body > *:nth-child(4) { animation-delay: 0.6s; }

/* 🎯 Gentle floating pulse for the icon */
h1 img {
  animation: floatLogo 3.5s ease-in-out infinite;
  filter: drop-shadow(0 0 16px rgba(0,255,136,0.45));
}

/* ✨ Lift + glow hover for download buttons */
.downloads a:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 24px rgba(0,255,136,0.55);
  background: #13ffa2;
}

/* ===== Keyframes ===== */
@keyframes shimmerFlow {
  from { transform: translateX(-50%); }
  to { transform: translateX(50%); }
}
@keyframes riseIn {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes floatLogo {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

  <script>
  // 🧭 Toast helper (simple, reusable)
  function showToast(message) {
    const toast = document.createElement("div");
    toast.textContent = message;
    toast.style.position = "fixed";
    toast.style.bottom = "25px";
    toast.style.left = "50%";
    toast.style.transform = "translateX(-50%)";
    toast.style.background = "rgba(0, 255, 136, 0.15)";
    toast.style.color = "#00ff88";
    toast.style.padding = "10px 18px";
    toast.style.borderRadius = "8px";
    toast.style.fontSize = "14px";
    toast.style.fontWeight = "500";
    toast.style.boxShadow = "0 0 10px rgba(0,255,136,0.25)";
    toast.style.backdropFilter = "blur(8px)";
    toast.style.zIndex = "9999";
    toast.style.transition = "opacity 0.3s ease";
    document.body.appendChild(toast);
    setTimeout(() => (toast.style.opacity = "0"), 2200);
    setTimeout(() => toast.remove(), 2600);
  }

  // 🪄 Capture Mac button clicks
  document.querySelectorAll('.downloads a').forEach(btn => {
    if (btn.textContent.includes("macOS")) {
      btn.addEventListener("click", e => {
        e.preventDefault(); // stop broken link
        showToast("🍎 macOS version coming soon!");
      });
    }
  });
</script>
